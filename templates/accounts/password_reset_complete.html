{% extends "base.html" %}
{% block title %}Mot de passe modifié{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="card p-5 shadow-sm">
                <div class="display-1 text-success mb-4"><i class="bi bi-check-circle-fill"></i></div>
                <h2 class="fw-bold">Mot de passe mis à jour !</h2>
                <p class="text-muted">Votre mot de passe a été modifié avec succès. Vous pouvez maintenant vous connecter avec vos nouveaux identifiants.</p>
                <a href="{% url 'login' %}" class="btn btn-primary rounded-xl px-4 mt-3">Aller à la connexion</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
