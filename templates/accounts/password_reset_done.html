{% extends "base.html" %}
{% block title %}Email envoyé{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="card p-5 shadow-sm">
                <div class="display-1 text-warning mb-4"><i class="bi bi-envelope-check"></i></div>
                <h2 class="fw-bold">Vérifiez vos emails</h2>
                <p class="text-muted">Nous avons envoyé un lien de réinitialisation à l'adresse fournie. Veuillez vérifier votre boîte de réception (et vos spams).</p>
                <a href="{% url 'home' %}" class="btn btn-primary rounded-xl px-4 mt-3">Retour à l'accueil</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
